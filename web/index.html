<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAC VTT</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="lobby">
      <section id="who-card" class="card">
        <h1>PAC VTT</h1>
        <div id="me" hidden>
          <div class="me-row">
            <span id="me-face" class="face"></span>
            <div><small class="muted">Signed in as</small><strong id="me-name"></strong></div>
          </div>
          <div class="me-actions">
            <button type="button" id="profile-btn">Profile</button>
            <button type="button" id="players-btn" hidden>Players</button>
            <button type="button" id="sign-out">Sign out</button>
          </div>
        </div>
        <form id="who">
          <p class="muted hint">Players: open your personal link to sign in. Or join as a guest:</p>
          <label>Your name <input name="name" required maxlength="40" autocomplete="nickname" /></label>
          <label>Table key <input name="key" type="password" required autocomplete="current-password" /></label>
          <button type="submit">Show rooms</button>
          <button type="button" id="setup-btn" class="link-btn" hidden>First time? Set up players and make yourself the admin</button>
        </form>
        <label class="check"><input type="checkbox" id="camera-on" checked /> Camera on</label>
      </section>

      <section id="rooms" class="card" hidden>
        <h2>Rooms</h2>
        <p id="invite" class="invite" hidden></p>
        <ul id="room-list"></ul>
        <form id="new-room">
          <h3>New room</h3>
          <label>Name <input name="name" required maxlength="60" placeholder="e.g. Tuesday campaign" /></label>
          <label>System <select name="system"></select></label>
          <button type="submit">Create room</button>
        </form>
      </section>
      <p id="lobby-error" class="error" hidden></p>
    </main>

    <main id="room-lobby" hidden></main>

    <main id="room-view" hidden>
      <header>
        <strong id="room-name"></strong>
        <span id="room-system" class="muted"></span>
        <span class="spacer"></span>
        <span id="gm-status" class="muted"></span>
        <button id="gm-btn" type="button"></button>
        <button id="copy-link" type="button">Copy invite link</button>
      </header>
      <section id="stage"></section>
      <section id="board">
        <p class="placeholder">The shared table goes here (cards, maps, drawing).</p>
      </section>
      <button id="side-tab" type="button" title="Hide chat and dice">Chat &amp; dice</button>
      <aside id="side">
        <p id="conn-status" hidden>Reconnecting…</p>
        <ol id="log"></ol>
        <div id="dice">
          <button type="button" data-expr="d4">d4</button>
          <button type="button" data-expr="d6">d6</button>
          <button type="button" data-expr="d8">d8</button>
          <button type="button" data-expr="d10">d10</button>
          <button type="button" data-expr="d12">d12</button>
          <button type="button" data-expr="d20">d20</button>
          <button type="button" data-expr="d100">d100</button>
        </div>
        <form id="roll-form" class="inline">
          <input name="expr" placeholder="2d6+3" autocomplete="off" maxlength="60" />
          <button type="submit">Roll</button>
        </form>
        <form id="chat-form" class="inline">
          <input name="text" placeholder="Say something…" autocomplete="off" maxlength="500" />
          <button type="submit">Send</button>
        </form>
        <button id="undo-btn" type="button" title="Undo your last action">Undo</button>
      </aside>
      <footer id="controls">
        <button id="mic-btn" type="button">Mute</button>
        <button id="cam-btn" type="button">Camera off</button>
        <select id="mic-select" title="Microphone"></select>
        <select id="cam-select" title="Camera"></select>
        <select id="spk-select" title="Speaker"></select>
        <button id="leave-btn" type="button" class="danger">Leave</button>
      </footer>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
